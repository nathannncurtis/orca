<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818b98"/>
    </marker>
    <style>
      .lane { fill: #f6f8fa; stroke: #d1d9e0; }
      .laneT { font-size: 15px; font-weight: 700; fill: #59636e; letter-spacing: .04em; }
      .box { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
      .acc { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.8; }
      .t { font-size: 16px; font-weight: 650; fill: #1f2328; }
      .s { font-size: 13px; fill: #59636e; }
      .l { font-size: 12.5px; fill: #59636e; }
      .ld { font-size: 12.5px; fill: #59636e; font-style: italic; }
      .e { stroke: #59636e; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .ed { stroke: #818b98; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#d); }
    </style>
  </defs>
    <g transform="translate(0,60)">

  <!-- lanes -->
  <rect class="lane" x="20" y="20" width="260" height="660" rx="14"/>
  <text class="laneT" x="40" y="50">VENDOR SYSTEM</text>
  <text class="s" x="40" y="70">not yours, not changed</text>

  <rect class="lane" x="320" y="20" width="580" height="660" rx="14"/>
  <text class="laneT" x="340" y="50">YOUR PLATFORM</text>

  <rect class="lane" x="940" y="20" width="240" height="660" rx="14"/>
  <text class="laneT" x="960" y="50">CLIENTS</text>

  <!-- vendor -->
  <g>
    <path class="box" d="M60,250 v70 a90,16 0 0 0 180,0 v-70"/>
    <ellipse class="box" cx="150" cy="250" rx="90" ry="16"/>
    <text class="t" x="150" y="298" text-anchor="middle">Source database</text>
  </g>
  <rect class="box" x="60" y="540" width="180" height="60" rx="10"/>
  <text class="t" x="150" y="576" text-anchor="middle">Vendor API</text>

  <!-- platform -->
  <rect class="acc" x="360" y="90" width="230" height="64" rx="10"/>
  <text class="t" x="475" y="117" text-anchor="middle">Change capture</text>
  <text class="s" x="475" y="138" text-anchor="middle">hints: table + keys</text>

  <rect class="acc" x="360" y="240" width="230" height="64" rx="10"/>
  <text class="t" x="475" y="267" text-anchor="middle">Operational store</text>
  <text class="s" x="475" y="288" text-anchor="middle">raw copy of every table</text>

  <rect class="acc" x="360" y="370" width="230" height="64" rx="10"/>
  <text class="t" x="475" y="397" text-anchor="middle">Anti-corruption layer</text>
  <text class="s" x="475" y="418" text-anchor="middle">translation library, no I/O</text>

  <rect class="acc" x="640" y="370" width="230" height="64" rx="10"/>
  <text class="t" x="755" y="397" text-anchor="middle">Read models</text>
  <text class="s" x="755" y="418" text-anchor="middle">versioned, with outbox</text>

  <rect class="box" x="640" y="240" width="230" height="64" rx="10"/>
  <text class="t" x="755" y="267" text-anchor="middle">Delivery</text>
  <text class="s" x="755" y="288" text-anchor="middle">fan-out, delivery only</text>

  <rect class="box" x="500" y="540" width="250" height="64" rx="10"/>
  <text class="t" x="625" y="567" text-anchor="middle">Write queue + leases</text>
  <text class="s" x="625" y="588" text-anchor="middle">one claimer, never resend blind</text>

  <!-- client -->
  <rect class="box" x="965" y="300" width="190" height="84" rx="10"/>
  <text class="t" x="1060" y="332" text-anchor="middle">Client app</text>
  <text class="s" x="1060" y="353" text-anchor="middle">local cache</text>
  <text class="s" x="1060" y="371" text-anchor="middle">+ intent log</text>

  <!-- reads -->
  <path class="e" d="M240,262 C300,200 310,130 356,122"/>
  <text class="l" x="262" y="170">trace of writes</text>

  <path class="e" d="M475,154 L475,236"/>
  <text class="l" x="485" y="190">hint stream</text>
  <text class="l" x="485" y="206">resumable, gaps flagged</text>

  <path class="e" d="M356,282 L244,282"/>
  <text class="l" x="252" y="270">re-read by key,</text>
  <text class="l" x="252" y="300" dy="0">committed only</text>

  <path class="ed" d="M356,300 C320,330 280,340 244,330"/>
  <text class="ld" x="262" y="356">checksum sweeps</text>

  <path class="e" d="M475,304 L475,366"/>
  <path class="e" d="M590,402 L636,402"/>
  <path class="e" d="M755,370 L755,308"/>
  <path class="e" d="M870,272 C920,272 920,330 961,334"/>
  <text class="l" x="878" y="232">whole versions,</text>
  <text class="l" x="878" y="248">commit order</text>

  <!-- writes -->
  <path class="e" d="M1060,384 C1060,520 900,572 754,572"/>
  <text class="l" x="960" y="480">intents</text>
  <path class="e" d="M500,572 L244,572"/>
  <text class="l" x="300" y="560">send through the API</text>
  <path class="e" d="M150,540 L150,340"/>
  <text class="l" x="158" y="460">applies the write</text>

  </g>
  <!-- fallback, routed above the lanes -->
  <path class="ed" d="M1060,360 L1060,140 Q1060,40 980,40 L295,40 Q215,40 215,140 L215,300"/>
  <text class="ld" x="600" y="30" text-anchor="middle">fallback when the platform is down: one record, same library, marked live</text>
</svg>
